spring:
  rabbitmq:
    listener:
      simple:
        concurrency: 1
        max-concurrency: 2
        prefetch: 1

app:
  rabbitmq:
    exchange: fiapx.events
    queue: video.processing
    routing-key-video-requested: video.requested
    routing-key-video-processing: video.processing
    routing-key-video-completed: video.completed
    routing-key-video-failed: video.failed
  storage:
    output-dir: ${java.io.tmpdir}/fiapx-processor-it/output
  processing:
    ffmpeg-command: ${FFMPEG_COMMAND:${user.dir}/src/test/resources/scripts/fake-ffmpeg.sh}
    fps: 1
